name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm --prefix backend run test

      # Runs backend tsc --noEmit and the frontend build (tsc -b + vite build),
      # so this covers both typechecking and the production bundle.
      #
      # The VITE_ values are placeholders, not secrets. They exist because Vite
      # inlines them at build time: without them the app folds to a constant
      # "not configured" branch and the bundler eliminates the rest as dead
      # code, so CI would pass while proving nothing about the real bundle.
      # vite.config.ts fails the build rather than emitting that artifact.
      - name: Typecheck and build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run typecheck
