# Backend deployment. The frontend deploys separately from frontend/vercel.json.
#
# Split on purpose: the API holds the service role key and must never be built
# into anything a browser downloads. Keeping them on different platforms makes
# that boundary a deployment fact rather than a convention someone has to
# remember.

services:
  - type: web
    name: tripti-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend

    # `npm ci` rather than `install`: a deploy must build the lockfile's tree,
    # not whatever resolves that morning.
    #
    # `--include=dev` is load-bearing. NODE_ENV is set to production below, and
    # npm reads that at install time and omits devDependencies — which is where
    # typescript, @types/express and @types/node live. Without them tsc either
    # is not installed at all, or runs with no type definitions for Express and
    # reports every `req`, `res` and `next` in every router as an implicit any
    # (TS7006). The error points at the route files, so it reads like a code
    # problem; it is an install problem.
    #
    # The runtime still needs none of them: `npm start` runs compiled JS, and
    # the production dependency tree is unchanged by this flag.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    # Every push to the tracked branch rebuilds and redeploys. `autoDeploy: true`
    # is the deprecated spelling of this.
    autoDeployTrigger: commit

    # Render holds traffic until this returns 2xx, and rolls back rather than
    # replacing a working instance with a broken one. /health is unauthenticated
    # and says nothing about the deployment — it is reachable from anywhere.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'

      # Render assigns the port; config.ts reads it.
      - key: PORT
        value: 10000

      # sync: false means Render prompts for the value and stores it encrypted
      # rather than reading it from this file. None of these belong in git.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Bypasses row level security. If it ever leaks, rotate it in Supabase
      # immediately — every RLS policy in the project is void while it is out.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Both of the following are safe to leave BLANK at blueprint time.
      #
      # Render submits an untouched field as an empty string rather than
      # omitting it, and config.ts now treats blank and absent as the same
      # thing — so a blank here falls through to the documented default instead
      # of failing validation and killing the process before it listens. That
      # cost one failed deploy to learn.

      # Optional for good. Without it extraction falls back to the deterministic
      # keyword scan: reports are still accepted and every screen still works,
      # they are just flagged for manual triage because no model has read them.
      - key: ANTHROPIC_API_KEY
        sync: false

      # Not knowable yet — it is the Vercel URL, which does not exist until the
      # frontend is deployed. Leave blank now and set it afterwards, otherwise
      # the browser app cannot call this API at all.
      - key: CORS_ORIGINS
        sync: false
